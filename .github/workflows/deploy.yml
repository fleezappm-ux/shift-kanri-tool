name: Deploy shift tool to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:worktime
      - run: npm run test:reset
      - run: npm run build
        env:
          # あおい薬局のウェブアプリURL（従業員はURLを開くだけで使える）
          VITE_SHIFT_GAS_URL: "https://script.google.com/macros/s/AKfycbyUHRu4OzQj8VBNgdnlKHeIU3LXt4JSv-pPNc0eaRJ99E8n_eSXU77sjzqLRLJAeA6B2g/exec"
          # リポジトリ名を変えて複製しても、公開サイトが真っ白にならないように、公開先の名前から自動で決める
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
